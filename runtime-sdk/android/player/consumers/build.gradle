plugins { id 'com.android.application' version '8.9.1' }

def game = new groovy.json.JsonSlurper().parse(file('egret-app.json'), 'UTF-8')
def player = new java.util.zip.ZipFile(file('libs/egret-player.aar')).withCloseable { aar ->
    def marker = aar.getEntry('assets/egret-player-host.txt')
    [minApi: marker == null ? 26 : 29,
     host: marker == null ? 'webview' : aar.getInputStream(marker).withCloseable { it.getText('UTF-8').trim() },
     systemBack: aar.getEntry('assets/egret-player-features/system-back-v1') != null]
}

// Also guard a prebuilt AAR: exporting the sources does not select the VM already in this archive.
def projectAssets = new groovy.json.JsonSlurper().parse(file('src/main/assets/game/project.json'), 'UTF-8')
def requiredV8 = projectAssets.requiredV8Features ?: []
if ((player.host == 'webview' && !requiredV8.empty) || (player.host != 'standard' && 'Intl' in requiredV8)) {
    throw new GradleException("Selected ${player.host} AAR cannot satisfy requiredV8Features: ${requiredV8}")
}

// Only configure a release signer from the submitting application's environment.
// Running the exporter never reads the keystore or serializes its credentials.
def releasePath = System.getenv('EGRET_ANDROID_KEYSTORE')
def releaseAlias = System.getenv('EGRET_ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('EGRET_ANDROID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('EGRET_ANDROID_KEY_PASSWORD')
def releaseStore = releasePath ? new File(releasePath) : null
def signingReady = releaseStore?.isAbsolute() && releaseStore.isFile() &&
        releaseAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'org.egret.example'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId game.applicationId
        versionCode game.versionCode
        versionName game.versionName
        minSdk player.minApi
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
    }

    // Compile against the AAR selected by this app, including a previously delivered player.
    sourceSets.main.java.srcDir(player.systemBack ? 'src/egretBack/current/java' : 'src/egretBack/legacy/java')

    signingConfigs {
        if (signingReady) {
            release {
                storeFile releaseStore
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}

// Compact standalone APKs trade a smaller file for extracting the same ELF on install.
// Bundle-generated splits retain the direct-load policy and their native page alignment.
def nativeApk = providers.gradleProperty('egretApkPackaging').orElse('direct').get()
if (!(nativeApk in ['direct', 'compact'])) throw new GradleException('egretApkPackaging must be direct or compact')
androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
    variant.packaging.jniLibs.useLegacyPackaging.set(nativeApk == 'compact')
    variant.packaging.jniLibs.useLegacyPackagingFromBundle.set(false)
}

// Resolve only explicitly named, digest-pinned local archives. The exported project also
// checks the bytes on its customer's machine, including when Gradle builds offline.
def sha256 = { File archive ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    archive.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
def channelLock = file('egret-channel.json')
def channelLibraries = []
if (channelLock.exists()) {
    def profile = new groovy.json.JsonSlurper().parse(channelLock, 'UTF-8')
    if (profile.schemaVersion != 1 || !(profile.libraries instanceof List)) {
        throw new GradleException('Invalid egret-channel.json')
    }
    def channelDirectory = file('libs/channel')
    def onDisk = (channelDirectory.list() ?: []) as Set
    def seen = [] as Set
    profile.libraries.each { entry ->
        def name = entry.file
        if (!(name instanceof String) || !(name ==~ /[A-Za-z0-9_][A-Za-z0-9_.-]{0,110}\.(aar|jar)/) ||
                !seen.add(name.toLowerCase(Locale.ROOT)) || !onDisk.contains(name)) {
            throw new GradleException('Invalid, duplicate or missing local channel archive: ' + name)
        }
        def archive = new File(channelDirectory, name)
        if (!java.nio.file.Files.isRegularFile(archive.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                archive.canonicalFile.parentFile != channelDirectory.absoluteFile ||
                sha256(archive) != entry.sha256) {
            throw new GradleException('Channel archive identity mismatch: ' + name)
        }
        channelLibraries.add(archive)
    }
}
dependencies {
    implementation files('libs/egret-player.aar')
    implementation files(channelLibraries)
}

if (providers.gradleProperty('egretGameRevision').isPresent()) apply from: 'revision.gradle'
apply from: 'device.gradle'

// Applying the guard to packaging tasks also covers aggregate builds and Gradle
// task abbreviations, while permitting unsigned compilation, lint and R8 checks.
def verifySigning = tasks.register('verifyEgretReleaseSigning') {
    doLast {
        if (!signingReady) throw new GradleException(
                'For release artifacts, set EGRET_ANDROID_KEYSTORE to an existing absolute keystore path and ' +
                'set EGRET_ANDROID_KEY_ALIAS, EGRET_ANDROID_STORE_PASSWORD and EGRET_ANDROID_KEY_PASSWORD.')
    }
}
tasks.configureEach {
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']) {
        dependsOn verifySigning
    }
}
