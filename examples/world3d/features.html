<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World3D features / 白鹭 3D 功能展示</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "@egret/engine": "/packages/engine/dist/index.js",
        "@egret/engine/world3d": "/packages/engine/dist/rendering/world3d/index.js",
        "@egret/engine/webgl2/world3d": "/packages/engine/dist/web/world3d/index.js",
        "@egret/engine/webgpu/world3d": "/packages/engine/dist/web/world3d/webgpu.js",
        "@egret/contracts": "/packages/contracts/dist/index.js",
        "@egret/contracts/resources": "/packages/contracts/dist/resources/index.js",
        "@egret/runtime": "/packages/runtime/dist/index.js",
        "@egret/runtime/text": "/packages/runtime/dist/text/index.js",
        "@egret/runtime/ui": "/packages/runtime/dist/ui/index.js",
        "@egret/runtime/input": "/packages/runtime/dist/input/index.js",
        "@egret/runtime/paragraph": "/packages/runtime/dist/paragraph/index.js",
        "#egret-textured-frame-state": "/packages/engine/dist/internal/texturedFrameState.js",
        "#egret-pointer-input": "/packages/engine/dist/pointerInput.js"
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #12151d; color: #f3f5fd; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .6rem 1rem; }
    h1 { font-size: 1.1rem; margin: 0; }
    canvas { display: block; width: 100%; height: 100%; min-height: 0; touch-action: none; }
    a { color: #a7c7ff; }
    button { font: inherit; background: #252b3d; color: inherit; border: 1px solid #68768d; padding: .3rem .6rem; border-radius: .25rem; }
    button[aria-pressed="true"] { background: #3d4b78; }
    label { font-size: .9rem; } input { font: inherit; background: #1b2030; color: inherit; border: 1px solid #68768d; border-radius: .25rem; padding: .15rem .3rem; }
    button:focus-visible { outline: 2px solid #b7e26e; outline-offset: 2px; }
    output { font-variant-numeric: tabular-nums; opacity: .85; }
  </style>
</head>
<body>
  <header>
    <h1>World3D <span lang="zh-CN">功能展示</span></h1>
    <a id="backend" href="?backend=webgpu">WebGPU</a>
    <a href="index.html">Basics / 基础示例</a>
    <button id="surfaces" type="button">Surfaces / 表面</button>
    <button id="physics" type="button">Physics / 物理</button>
    <button id="editing" type="button">Editing / 编辑</button>
    <button id="shoot" type="button">Shoot / 发射</button>
    <button id="translate" type="button">Move / 移动</button>
    <button id="rotate" type="button">Turn / 旋转</button>
    <button id="scale" type="button">Size / 缩放</button>
    <button id="space" type="button">World / 世界</button>
    <button id="post" type="button" aria-pressed="true">Post / 后处理</button>
    <button id="ssao" type="button" aria-pressed="true">SSAO</button>
    <button id="dof" type="button" aria-pressed="false">Depth of field / 景深</button>
    <button id="shadows" type="button" aria-pressed="true">Shadows / 阴影</button>
    <label>Font / 字体 <input id="font" type="file" accept=".ttf,.ttc,.otf"></label>
    <label>Text / 文字 <input id="text" type="text" value="Egret 白鹭" size="12"></label>
    <output id="status" aria-live="polite">Loading / 加载中</output>
  </header>
  <canvas id="stage" aria-label="Interactive 3D scene; drag to orbit, scroll to zoom, click an object to edit it / 可交互 3D 场景，拖动旋转，滚轮缩放，点击物体进行编辑"></canvas>
  <script type="module" src="./features.mjs"></script>
</body>
</html>
