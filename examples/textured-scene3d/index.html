<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textured 3D Scene / 贴图 3D 场景</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "@egret/engine": "/packages/engine/dist/index.js",
        "@egret/engine/scene3d/authoring": "/packages/engine/dist/rendering/scene3dAuthoring.js",
        "@egret/engine/web/image": "/packages/engine/dist/web/image.js",
        "@egret/engine/webgl2/scene3d": "/packages/engine/dist/web/webgl2Scene3d.js",
        "@egret/engine/webgpu/scene3d": "/packages/engine/dist/web/scene3d.js",
        "@egret/contracts": "/packages/contracts/dist/index.js",
        "@egret/contracts/resources": "/packages/contracts/dist/resources/index.js",
        "@egret/runtime": "/packages/runtime/dist/index.js",
        "@egret/runtime/text": "/packages/runtime/dist/text/index.js",
        "@egret/runtime/ui": "/packages/runtime/dist/ui/index.js",
        "@egret/runtime/input": "/packages/runtime/dist/input/index.js",
        "@egret/runtime/paragraph": "/packages/runtime/dist/paragraph/index.js",
        "#egret-textured-frame-state": "/packages/engine/dist/internal/texturedFrameState.js",
        "#egret-pointer-input": "/packages/engine/dist/pointerInput.js",
        "robust-predicates": "/vendor/robust-predicates/index.js"
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #161922; color: #f3f5fd; }
    main { max-width: 32rem; margin: auto; padding: 1.5rem; }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); line-height: 1.25; }
    nav, .controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    canvas { display: block; width: min(100%, 30rem); height: auto; image-rendering: pixelated; border: 1px solid #565d73; margin: 1rem 0; }
    a { color: #a7c7ff; }
    button { font: inherit; background: #252b3d; color: inherit; border: 1px solid #68768d; padding: .4rem .65rem; border-radius: .25rem; }
    button:disabled { opacity: .5; }
    a:focus-visible, button:focus-visible { outline: 2px solid #b7e26e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Textured 3D scene / 贴图 3D 场景</h1>
    <nav aria-label="Render backend / 渲染后端"><a href="?backend=webgl2">WebGL2</a><a href="?backend=webgpu">WebGPU</a></nav>
    <canvas width="144" height="96" aria-label="Color texture on a 3D wall with a moving actor and HUD / 贴图墙、移动角色与 HUD"></canvas>
    <div class="controls">
      <button data-view="front" disabled>Move in front / 移到前面</button>
      <button data-view="behind" disabled>Move behind / 移到后面</button>
    </div>
    <p role="status">Starting / 正在启动</p>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
