  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 48rem; color: #172033; background: #f4f6fa; }
    #surface { margin: 1rem 0; }
    canvas { display: block; width: 100%; max-width: 720px; height: auto; border: 0; padding: 0; object-fit: fill; }
    button { margin: 0 .5rem .5rem 0; padding: .5rem .9rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Bitmap fonts / 位图字体</h1>
  <p>A title and a dialog in a BMFont read from its XML form, and a score in Egret's own form of frames. Each text is one mesh for each page of its font.<br>标题和对话框使用从 XML 格式读取的 BMFont，得分使用 Egret 自己的帧格式。每段文字按其字体的每一页绘制为一个网格。</p>
  <div id="surface"><canvas id="scene" width="720" height="405" tabindex="0"></canvas></div>
  <p><button id="add" type="button">+100</button><button id="align" type="button">对齐 / Align</button><button id="tint" type="button">着色 / Tint</button><button id="next" type="button">下一段 / Next</button></p>
  <p id="status">Starting… / 正在启动…</p>
  <pre id="state"></pre>
  <p><a href="./README.md">English instructions</a> · <a href="./README.zh-CN.md">中文说明</a></p>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
