name: M0
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # PR120 alone reuses prior exact Windows/Linux evidence.
  # 仅 PR120 精确复用 Windows/Linux 成功记录。
  retained:
    name: PR120 / retained Windows and Linux evidence
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 120 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify unchanged inputs and original successful executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const old='9620283c06f010f959c3b1638ce3db5f7c5eac9c', base='668d0a6c75bca6f77b637594b4cc5b7ce3c06411';
          const prior='1f5e79173375e5a86f097f264939227f13efecbb';
          const tree='97c7c43a6c7641e8669aceb6b5f4bc9be2270f7b', tested='5f09ea3501a8ee797308f9a2a66749f90e9b6771';
          const repo='cnedwin/Egret_rebuild', workflow='.github/workflows/ci.yml', ledger='source-origin.json';
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')), pr=event.pull_request;
          assert.equal(process.env.GITHUB_EVENT_NAME,'pull_request');
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(pr?.number,120);
          assert.equal(pr.head.repo.full_name,repo);
          assert.equal(pr.base.repo.full_name,repo);
          assert.equal(pr.base.sha,base);
          assert.match(pr.head.sha,/^[0-9a-f]{40}$/);
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:8*1024*1024}).trim();
          const raw=(ref,file)=>execFileSync('git',['show',ref+':'+file],{maxBuffer:8*1024*1024});
          const hash=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(git('show','-s','--format=%P',pr.head.sha),prior);
          assert.equal(git('show','-s','--format=%P',prior),old);
          assert.equal(git('show','-s','--format=%P','HEAD'),base+' '+pr.head.sha);
          assert.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);
          assert.equal(git('rev-parse','HEAD^{tree}'),git('rev-parse',pr.head.sha+'^{tree}'));
          assert.equal(git('rev-parse',old+'^{tree}'),tree);
          const excluded=new Set([workflow,ledger]);
          const entries=ref=>git('ls-tree','-rz',ref).split('\0').filter(Boolean);
          const rest=ref=>entries(ref).filter(row=>!excluded.has(row.split('\t')[1]));
          assert.deepEqual(rest(pr.head.sha),rest(old));
          assert.deepEqual(rest('HEAD'),rest(old));
          for(const file of excluded){
            for(const ref of [old,pr.head.sha,'HEAD'])assert.match(git('ls-tree',ref,'--',file),/^100644 blob /);
          }
          assert.deepEqual(git('diff','--name-status','--no-renames',old,pr.head.sha).split('\n'),['M\t'+workflow,'M\t'+ledger]);
          // The only ledger delta is the new workflow fingerprint, never arbitrary metadata.
          const expected=JSON.parse(raw(old,ledger)), bytes=raw(pr.head.sha,workflow);
          const rows=expected.files.filter(row=>row.path===workflow);
          assert.equal(rows.length,1);
          Object.assign(rows[0],{bytes:bytes.length,sha256:hash(bytes)});
          assert.deepEqual(raw(pr.head.sha,ledger),Buffer.from(JSON.stringify(expected,null,2)+'\n'));
          async function request(path,log=false){
            const response=await fetch('https://api.github.com/repos/'+repo+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},redirect:'manual',signal:AbortSignal.timeout(30000)});
            if(log&&response.status===302){
              const location=new URL(response.headers.get('location'));
              assert.equal(location.protocol,'https:');
              // Do not forward the GitHub credential to the signed log archive URL.
              const archive=await fetch(location,{signal:AbortSignal.timeout(30000)});
              assert.equal(archive.status,200);
              return Buffer.from(await archive.arrayBuffer());
            }
            assert.equal(response.status,200,'GitHub evidence response '+path);
            return log?Buffer.from(await response.arrayBuffer()):response.json();
          }
          const run=await request('/actions/runs/41859588505');
          const originalMerge=await request('/git/commits/'+tested);
          assert.equal(originalMerge.sha,tested);
          assert.equal(originalMerge.tree.sha,tree);
          assert.deepEqual(originalMerge.parents.map(parent=>parent.sha),[base,old]);
          assert.equal(run.id,41859588505);
          assert.equal(run.workflow_id,387330091);
          assert.equal(run.path,workflow);
          assert.equal(run.event,'pull_request');
          assert.equal(run.status,'completed');
          assert.equal(run.head_sha,old);
          assert.equal(run.head_repository.full_name,repo);
          const retained=[];
          // Hash exact transport bytes, including the observed UTF-8 BOM; do not normalize logs.
          for(const [id,name,digest] of [[126677391898,'windows','21801f3499ecaa6d29bfb8830c539e07a8fe1430ef166fc10fe1b561d6ae1fca'],[126677392440,'cpu (ubuntu-latest)','dcc779f70c1e8be4c749785ae08dbf34503651232ebe02d565f1ba025672d18e']]){
            const job=await request('/actions/jobs/'+id), check=await request('/check-runs/'+id);
            assert.equal(job.id,id);
            assert.equal(job.run_id,run.id);
            assert.equal(job.head_sha,old);
            assert.equal(job.name,name);
            assert.equal(job.status,'completed');
            assert.equal(job.conclusion,'success');
            assert.ok(job.steps.length>0&&job.steps.every(step=>step.conclusion==='success'));
            assert.equal(check.id,id);
            assert.equal(check.name,name);
            assert.equal(check.app.id,15368);
            assert.equal(check.head_sha,old);
            assert.equal(check.conclusion,'success');
            const log=await request('/actions/jobs/'+id+'/logs',true);
            assert.equal(hash(log),digest);
            const text=log.toString('utf8');
            assert.ok(text.includes('HEAD is now at '+tested.slice(0,7)+' Merge '+old+' into '+base));
            assert.ok(text.includes(tested));
            retained.push({id,name,sha256:digest,conclusion:job.conclusion});
          }
          console.log(JSON.stringify({status:'RETAINED_EVIDENCE_VERIFIED',head:pr.head.sha,base,tree:git('rev-parse','HEAD^{tree}'),previousHead:old,previousTree:tree,testedMerge:tested,run:run.id,retained}));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Windows and Linux: reused exact successful executions; not rerun. Only PR120 workflow and its fingerprint changed. Intel macOS CPU validation is still required; ARM64/GPU acceptance is not claimed.\n\nWindows/Linux：复用原成功执行，未重跑。仅工作流及其指纹变化；仍需 Intel macOS CPU 实测，不代表 ARM64/GPU 验收。\n');
          NODE
  # The route is decided once; the Windows jobs below read the same trusted answer.
  # 路线只判定一次；后续 Windows 作业读取同一个可信结论。
  route:
    name: Windows route
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 120 }}
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.windows-route.outputs.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Select Windows merge checks
        id: windows-route
        shell: pwsh
        env:
          EGRET_EVENT: ${{ github.event_name }}
          EGRET_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EGRET_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EGRET_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EGRET_PR_MERGE: ${{ github.sha }}
        run: |
          $profile = 'full'
          $receipt = 'No trusted documentation-only selection was established.'
          if ($env:EGRET_EVENT -ceq 'pull_request' -and $env:EGRET_BASE_REF -ceq 'main' -and $env:EGRET_PR_BASE -cmatch '^[0-9a-f]{40}$') {
            try {
              # Never let a candidate-selected classifier opt out of the full gate.
              $PSNativeCommandUseErrorActionPreference = $false
              foreach ($file in @('.github/workflows/ci.yml', 'tools/check-ci-documentation.mjs')) {
                $trusted = git --no-replace-objects rev-parse --verify "${env:EGRET_PR_BASE}:${file}" 2>$null
                if ($LASTEXITCODE -ne 0) { throw 'Base does not contain the current route policy.' }
                $checked = git --no-replace-objects rev-parse --verify "HEAD:${file}" 2>$null
                if ($LASTEXITCODE -ne 0 -or $checked -cne $trusted) { throw 'Candidate changes the route policy.' }
                $actual = git --no-replace-objects hash-object --no-filters -- $file 2>$null
                if ($LASTEXITCODE -ne 0 -or $actual -cne $trusted) { throw 'Checkout does not match the trusted route policy.' }
              }
              $receipt = node tools/check-ci-documentation.mjs $env:EGRET_EVENT $env:EGRET_BASE_REF $env:EGRET_PR_BASE $env:EGRET_PR_HEAD $env:EGRET_PR_MERGE
              if ($LASTEXITCODE -ne 0) { throw 'Route policy could not run.' }
              if (($receipt | ConvertFrom-Json).profile -ceq 'documentation') { $profile = 'documentation' }
            } catch {
              $receipt = $_.Exception.Message
            }
          }
          Write-Output "$profile Windows merge checks. $receipt"
          "profile=$profile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
  windows:
    needs: [route]
    runs-on: windows-latest
    # The test files run in the windows-tests shards; this job keeps every other merge check.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install exact PowerShell
        shell: pwsh
        env:
          GH_RELEASE_TOKEN: ${{ github.token }}
        run: |
          # Authenticate public metadata with the read-only job token; never forward it to the archive URL.
          $headers = @{ Authorization = "Bearer $env:GH_RELEASE_TOKEN"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v7.6.5
          $asset = $release.assets | Where-Object name -eq 'PowerShell-7.6.5-win-x64.zip'
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing verified PowerShell asset' }
          $archive = Join-Path $env:RUNNER_TEMP 'pwsh.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.digest.Substring(7)) { throw 'PowerShell checksum mismatch' }
          $target = Join-Path $env:RUNNER_TEMP 'egret-pwsh'
          Expand-Archive $archive $target
          $target | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Select canonical temporary directory
        shell: pwsh
        run: |
          $temporary = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $temporary -PathType Container)) { throw 'Cannot resolve temporary directory' }
          "TEMP=$temporary" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temporary" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Clean setup
        run: pnpm setup:dev --no-build
      - name: Documentation-only merge checks
        if: needs.route.outputs.profile == 'documentation'
        shell: pwsh
        env:
          EGRET_METADATA_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node tools/check-repository-hygiene.mjs --committed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/contribution-metadata.mjs --check --base $env:EGRET_METADATA_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check-publication.mjs --contribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File knowledge-base/tools/Validate-KnowledgeBase.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Windows documentation-only checks passed on the bound PR merge tree. Engine verification was not run in this job.' |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Full merge checks
        if: needs.route.outputs.profile != 'documentation'
        env:
          EGRET_METADATA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/prepush.mjs --integrated --no-tests
  # The complete test file list, dealt across parallel runners; every shard is required.
  # 完整测试文件清单分配到并行运行器；每个分片都是必需的。
  windows-tests:
    name: windows tests (${{ matrix.shard }}/4)
    needs: [route]
    if: ${{ needs.route.outputs.profile != 'documentation' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install exact PowerShell
        shell: pwsh
        env:
          GH_RELEASE_TOKEN: ${{ github.token }}
        run: |
          # Authenticate public metadata with the read-only job token; never forward it to the archive URL.
          $headers = @{ Authorization = "Bearer $env:GH_RELEASE_TOKEN"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v7.6.5
          $asset = $release.assets | Where-Object name -eq 'PowerShell-7.6.5-win-x64.zip'
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing verified PowerShell asset' }
          $archive = Join-Path $env:RUNNER_TEMP 'pwsh.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.digest.Substring(7)) { throw 'PowerShell checksum mismatch' }
          $target = Join-Path $env:RUNNER_TEMP 'egret-pwsh'
          Expand-Archive $archive $target
          $target | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Select canonical temporary directory
        shell: pwsh
        run: |
          $temporary = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $temporary -PathType Container)) { throw 'Cannot resolve temporary directory' }
          "TEMP=$temporary" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temporary" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Clean setup
        run: pnpm setup:dev --no-build
      - name: Build
        run: node tools/build.mjs
      - name: Test files of this shard
        run: node tools/test.mjs --shard=${{ matrix.shard }}/4
  cpu:
    needs: [retained]
    if: ${{ always() && !cancelled() && (needs.retained.result == 'success' || needs.retained.result == 'skipped') }}
    strategy:
      fail-fast: false
      # Hosted ARM64 did not start on current main; Intel retains the same macOS CPU suite.
      # 当前主干的托管 ARM64 作业未启动；Intel 保留相同 macOS CPU 检查。
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.number == 120 && '["macos-15-intel"]' || '["ubuntu-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Declared portable CPU suite
        run: node --test tests/matrix4.test.mjs tests/display-tree.test.mjs
      - run: node examples/headless.mjs
  merge-ready:
    name: M0 / merge-ready
    if: ${{ always() }}
    needs: [retained, route, windows, windows-tests, cpu]
    runs-on: ubuntu-latest
    steps:
      - name: Require all declared jobs
        env:
          PR120: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 120 }}
          RETAINED_RESULT: ${{ needs.retained.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
          ROUTE_PROFILE: ${{ needs.route.outputs.profile }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_TESTS_RESULT: ${{ needs.windows-tests.result }}
          CPU_RESULT: ${{ needs.cpu.result }}
        run: |
          if [ "$PR120" = true ]; then
            test "$RETAINED_RESULT" = success
            test "$ROUTE_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            test "$WINDOWS_TESTS_RESULT" = skipped
          else
            test "$RETAINED_RESULT" = skipped
            test "$ROUTE_RESULT" = success
            test "$WINDOWS_RESULT" = success
            # Only the trusted documentation route may leave the test shards unrun.
            if [ "$ROUTE_PROFILE" = documentation ]; then
              test "$WINDOWS_TESTS_RESULT" = skipped
            else
              test "$ROUTE_PROFILE" = full
              test "$WINDOWS_TESTS_RESULT" = success
            fi
          fi
          test "$CPU_RESULT" = success
