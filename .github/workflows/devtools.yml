name: Performance monitor
on:
  pull_request:
    paths: ['devtools/**', '.github/workflows/devtools.yml']
  push:
    branches: [main]
    paths: ['devtools/**', '.github/workflows/devtools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Performance monitor build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node devtools/tools/build.mjs
      - run: node --test devtools/tests/*.test.mjs
