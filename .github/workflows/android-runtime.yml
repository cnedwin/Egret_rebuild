name: Android Runtime SDK
on:
  pull_request:
    paths: ['.cargo/config.toml', 'runtime-sdk/**', 'third-party/icu-19dfb44.LICENSE', 'third-party/v8-15.7.112.19.NOTICES', '.github/workflows/android-runtime.yml']
  push:
    branches: [main]
    paths: ['.cargo/config.toml', 'runtime-sdk/**', 'third-party/icu-19dfb44.LICENSE', 'third-party/v8-15.7.112.19.NOTICES', '.github/workflows/android-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: Build and verify the arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Build the JS workspace and verify the scene
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node tools/build.mjs
          node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --strict --target ES2022 --module esnext --moduleResolution bundler runtime-sdk/project/android-player-project.d.ts
          node --test runtime-sdk/scene/*.test.mjs runtime-sdk/project/*.test.mjs runtime-sdk/android/player/*.test.mjs
          esbuild=$(node -p "require('./examples/starter/release/package.json').devDependencies.esbuild")
          npm install --prefix "$RUNNER_TEMP/bundler" --no-save --ignore-scripts --no-audit --no-fund "esbuild@$esbuild"
          node runtime-sdk/scene/build.mjs --esbuild "$RUNNER_TEMP/bundler/node_modules/esbuild" --out "$RUNNER_TEMP/scene"
      - name: Test the command decoder and build the native host
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          cargo test --locked --offline --manifest-path runtime-sdk/native/Cargo.toml
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" || ! -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            fi
            test -x "$sdkmanager"
            "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          fi
          cargo build --locked --offline --release --manifest-path runtime-sdk/native/Cargo.toml --target aarch64-linux-android --target-dir "$RUNNER_TEMP/native"
          host=(--scene "$RUNNER_TEMP/scene" --jdk "$JAVA_HOME_17_X64" --ndk "$ANDROID_HOME/ndk/27.2.12479018" --rust-lib "$RUNNER_TEMP/native/aarch64-linux-android/release/libegret_runtime_native.a")
          node runtime-sdk/android/build.mjs "${host[@]}" --output "$RUNNER_TEMP/apk/egret-runtime.apk"
          for profile in standard trimmed; do
            node runtime-sdk/android/build.mjs "${host[@]}" --v8-profile "$profile" --output "$RUNNER_TEMP/apk/egret-runtime-$profile.apk"
          done
      - name: Build the player AARs and standalone or embedded consumers
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/egret-gradle
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/player-tools"
          node runtime-sdk/android/player/build-aar.mjs --jdk "$JAVA_HOME" --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
            --rust-lib "$RUNNER_TEMP/native/aarch64-linux-android/release/libegret_runtime_native.a" --out "$RUNNER_TEMP/apk/egret-player.aar"
          # Exercise replay, WebView transport, packaged assets and project saves against the shipped classes.
          replay_test="$RUNNER_TEMP/player-replay-test"
          mkdir -p "$replay_test"
          (cd "$replay_test" && "$JAVA_HOME/bin/jar" xf "$RUNNER_TEMP/apk/egret-player.aar" classes.jar)
          player_cp="$replay_test/classes.jar:$ANDROID_HOME/platforms/android-35/android.jar"
          "$JAVA_HOME/bin/javac" --release 8 -encoding UTF-8 -cp "$player_cp" -d "$replay_test" \
            runtime-sdk/android/player/test/org/egret/runtime/player/{ProjectReplayTapeTest,WebViewFrameTransportTest,ProjectAssetReadsTest,ProjectSaveStorageTest}.java
          "$JAVA_HOME/bin/java" -cp "$replay_test:$player_cp" org.egret.runtime.player.ProjectReplayTapeTest
          "$JAVA_HOME/bin/java" -cp "$replay_test:$player_cp" org.egret.runtime.player.WebViewFrameTransportTest
          "$JAVA_HOME/bin/java" -cp "$replay_test:$player_cp" org.egret.runtime.player.ProjectSaveStorageTest
          # Exercise the same JNI entry as the AAR, using the host CPU for this JVM check.
          cc -std=c11 -O2 -shared -fPIC -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            runtime-sdk/android/src/chunk_base64.c -o "$replay_test/libegret_player.so"
          "$JAVA_HOME/bin/java" -Djava.library.path="$replay_test" -cp "$replay_test:$player_cp" org.egret.runtime.player.ProjectAssetReadsTest
          # The hosted runner can miss Central artifacts which are present on Google's Central mirror.
          cat > "$RUNNER_TEMP/central-mirror.gradle" <<'GRADLE'
          settingsEvaluated { settings ->
            settings.pluginManagement.repositories.maven {
              name = 'MavenCentralGoogleMirror'
              url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
            }
          }
          GRADLE
          for variant in standalone embedded standard trimmed; do
            aar="$RUNNER_TEMP/apk/egret-player.aar"
            layout="$variant"
            if [[ "$variant" == standard || "$variant" == trimmed ]]; then
              layout=embedded
              aar="$RUNNER_TEMP/apk/egret-player-$variant.aar"
              node runtime-sdk/android/player/build-aar.mjs --jdk "$JAVA_HOME" --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
                --rust-lib "$RUNNER_TEMP/native/aarch64-linux-android/release/libegret_runtime_native.a" \
                --v8-profile "$variant" --v8-cache "$RUNNER_TEMP/apk/v8-cache" --out "$aar"
            fi
            app="$RUNNER_TEMP/game-$variant"
            node runtime-sdk/android/player/create-app.mjs --layout "$layout" --id "org.egret.example.$variant" \
              --aar "$aar" --project runtime-sdk/examples/moon-herbarium \
              --esbuild "$RUNNER_TEMP/bundler/node_modules/esbuild" --out "$app"
            "$RUNNER_TEMP/player-tools/gradle-8.9/bin/gradle" --init-script "$RUNNER_TEMP/central-mirror.gradle" -p "$app" assembleDebug
            cp "$app/build/outputs/apk/debug/EgretGame-debug.apk" "$RUNNER_TEMP/apk/game-$variant.apk"
            if [[ "$variant" == trimmed ]]; then
              # Exercise the distributed AAR's Java/JNI retention rules in a consuming app.
              cat >> "$app/build.gradle" <<'R8'
          android {
            buildTypes {
              release {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
              }
            }
          }
          R8
              "$RUNNER_TEMP/player-tools/gradle-8.9/bin/gradle" --init-script "$RUNNER_TEMP/central-mirror.gradle" -p "$app" minifyReleaseWithR8
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: egret-runtime-android-arm64-debug
          path: |
            ${{ runner.temp }}/apk/*.apk
            ${{ runner.temp }}/apk/*.aar
          if-no-files-found: error
