name: Advisory source lint
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'devtools/**'
      - 'biome.json'
      - 'biome.lint.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Report package lint findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix tools/format
      - env:
          EGRET_LINT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            node tools/lint.mjs --base "$EGRET_LINT_PR_BASE"
          else
            node tools/lint.mjs
          fi
