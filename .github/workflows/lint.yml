name: Advisory source lint
on:
  pull_request:
    paths:
      - 'packages/*/src/**/*.ts'
      - 'packages/*/web/**/*.ts'
      - 'packages/*/rendering/**/*.ts'
      - 'biome.json'
      - 'biome.lint.json'
      - 'tools/lint.mjs'
      - 'tools/format.mjs'
      - 'tools/format/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Report package lint findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix tools/format
      - run: node tools/lint.mjs
