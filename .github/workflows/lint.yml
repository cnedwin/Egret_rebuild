name: Advisory source lint
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'devtools/**'
      - 'biome.json'
      - 'biome.lint.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Report package lint findings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --prefix tools/format
      # A pull request checks out its merge commit. The recorded base SHA is the main tip at the
      # last push; if main has moved since, it is absent from this fetch. The merge commit's first
      # parent is the main tip it was built on, so the advisory reports exactly the files the
      # pull request adds there.
      - run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git rev-parse --verify --quiet 'HEAD^2^{commit}' > /dev/null || {
              echo 'The pull request checkout is not a merge commit.' >&2
              exit 1
            }
            node tools/lint.mjs --base "$(git rev-parse --verify 'HEAD^1^{commit}')"
          else
            node tools/lint.mjs
          fi
